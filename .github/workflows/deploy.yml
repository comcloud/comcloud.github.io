name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 被 publish-from-issue.yml 复用：GITHUB_TOKEN 提交的推送不会再触发工作流，
  # 所以发文那条链路要在同一次运行里显式调用部署。
  workflow_call:
    inputs:
      ref:
        description: 要构建的 commit；留空则用触发本次运行的 sha
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 发文链路里 github.sha 是 issue 触发时的旧 commit，必须显式指定新推上去的那个
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
